<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBGHAT AI - Text to Image Generator</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Extra professional logo styling */
        .logo-img {
            width: 90px;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
            border-radius: 12px;
        }

        .logo {
            text-align: center;
            font-size: 40px;
            font-weight: 700;
        }

        .logo span {
            color: #00e5ff;
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- LOGO IMAGE -->
        <img src="logo.png" alt="SIBGHAT AI Logo" class="logo-img">

        <!-- Title -->
        <h1 class="logo">
            SIBGHAT <span>AI</span>
        </h1>

        <p class="subtitle">
            Create stunning AI Images from your imagination.
        </p>

        <!-- Prompt -->
        <textarea
            id="prompt"
            placeholder="Describe the image you want to generate..."
        ></textarea>

        <!-- Style Selector -->
        <label for="style">Choose Style</label>

        <select id="style">
            <option value="">Default</option>
            <option value="realistic">Realistic</option>
            <option value="anime">Anime</option>
            <option value="cinematic">Cinematic</option>
            <option value="3d render">3D Render</option>
            <option value="fantasy">Fantasy</option>
        </select>

        <!-- Image Size Selector -->
        <label for="size">Image Size</label>

        <select id="size">
            <option value="square">Square (1:1)</option>
            <option value="portrait">Portrait (2:3)</option>
            <option value="landscape">Landscape (16:9)</option>
        </select>

        <!-- Generate Button -->
        <button id="generateBtn">
            ✨ Generate Image
        </button>

        <!-- Loading -->
        <div id="loading" class="hidden">
            Generating your masterpiece...
        </div>

        <!-- Image Output -->
        <div id="imageContainer">
            <img id="resultImage" src="" alt="">
        </div>

        <!-- Download -->
        <a id="downloadBtn" class="hidden" download="SIBGHAT-AI.png">
            Download Image
        </a>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
