<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIBGHAT AI - Professional</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark">

  <!-- Splash Screen -->
  <section id="splash-screen">
    <img src="logo.png" alt="SIBGHAT AI Logo" class="splash-logo" />
    <h1 class="splash-title">SIBGHAT <span>AI</span></h1>
    <p class="splash-subtitle">✨ Turning imagination into reality...</p>
  </section>

  <!-- Login Section -->
  <section id="login-section">
    <h2>🔑 Login</h2>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" required />
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
    <p>Not registered? <a href="#" id="showSignup">Signup here</a></p>
  </section>

  <!-- Signup Section -->
  <section id="signup-section" style="display:none;">
    <h2>📝 Signup</h2>
    <form id="signupForm">
      <label for="newUsername">Username</label>
      <input type="text" id="newUsername" required />
      <label for="newPassword">Password</label>
      <input type="password" id="newPassword" required />
      <button type="submit">Signup</button>
    </form>
    <p id="signupMessage"></p>
    <p>Already have an account? <a href="#" id="showLogin">Login here</a></p>
  </section>

  <!-- Owner Access Section -->
  <section id="owner-section">
    <h2>🔒 Code For Only AI Owner</h2>
    <form onsubmit="event.preventDefault(); ownerAccess(document.getElementById('ownerCode').value);">
      <input type="text" id="ownerCode" placeholder="Enter owner code..." required />
      <button type="submit">Access</button>
    </form>
  </section>

  <!-- Main App -->
  <div id="app" style="display:none;">
    <aside id="sidebar">
      <h2>⚡ History</h2>
      <button id="clearHistoryBtn">Clear History</button>
      <div id="history"></div>
    </aside>
    <main class="container">
      <header class="branding">
        <img src="logo.png" alt="SIBGHAT AI Logo" class="logo-img" />
        <h1 class="logo">SIBGHAT <span>AI</span></h1>
        <p class="subtitle">Describe your vision, let AI create it</p>
      </header>
      <section class="prompt-section">
        <textarea id="prompt" placeholder="Describe your image..."></textarea>
      </section>
      <section id="suggestions">
        <button onclick="setPrompt('A futuristic city at night neon lights')">City</button>
        <button onclick="setPrompt('A cinematic lion in jungle ultra realistic')">Lion</button>
        <button onclick="setPrompt('Cyberpunk robot warrior glowing sword')">Robot</button>
      </section>
      <section class="options">
        <label for="category">Category</label>
        <select id="category">
          <option value="">No Category</option>
          <option value="car">Car 🚗</option>
          <option value="space">Space 🌌</option>
          <option value="natural">Natural 🌿</option>
          <option value="city">City 🏙️</option>
          <option value="anime">Anime 🎨</option>
        </select>
        <label for="style">Style</label>
        <select id="style">
          <option>Default</option>
          <option>Realistic</option>
          <option>Anime</option>
          <option>Cinematic</option>
        </select>
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="purple">Purple</option>
          <option value="green">Green</option>
        </select>
      </section>
      <button id="generateBtn">✨ Generate Image</button>
      <div id="loading" class="hidden">⏳ AI is thinking...</div>
      <section id="imageContainer">
        <img id="resultImage" alt="Generated Image" />
        <a id="downloadBtn" class="hidden">Download</a>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
