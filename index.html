<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIBGHAT AI - Professional</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-dark">

  <!-- Splash Screen -->
  <section id="splash-screen" aria-label="Loading screen">
    <img src="logo.png" alt="SIBGHAT AI Logo" class="splash-logo" />
    <h1 class="splash-title">SIBGHAT <span>AI</span></h1>
    <p class="splash-subtitle">✨ Turning imagination into reality...</p>
  </section>

  <!-- Main App -->
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar" aria-label="History panel">
      <h2>⚡ History</h2>
      <button id="clearHistoryBtn">Clear History</button>
      <div id="history"></div>
    </aside>

    <!-- Main Container -->
    <main class="container">

      <!-- Branding -->
      <header class="branding">
        <img src="logo.png" alt="SIBGHAT AI Logo" class="logo-img" />
        <h1 class="logo">SIBGHAT <span>AI</span></h1>
        <p class="subtitle">Describe your vision, let AI create it</p>
      </header>

      <!-- Prompt Input -->
      <section class="prompt-section">
        <label for="prompt" class="sr-only">Image Description</label>
        <textarea id="prompt" placeholder="Describe your image..."></textarea>
      </section>

      <!-- Suggestions -->
      <section id="suggestions" aria-label="Quick suggestions">
        <button onclick="setPrompt('A futuristic city at night neon lights')">City</button>
        <button onclick="setPrompt('A cinematic lion in jungle ultra realistic')">Lion</button>
        <button onclick="setPrompt('Cyberpunk robot warrior glowing sword')">Robot</button>
      </section>

      <!-- Options -->
      <section class="options">
        <label for="category">Category</label>
        <select id="category">
          <option value="">No Category</option>
          <option value="car">Car 🚗</option>
          <option value="space">Space 🌌</option>
          <option value="natural">Natural 🌿</option>
          <option value="city">City 🏙️</option>
          <option value="anime">Anime 🎨</option>
        </select>

        <label for="style">Style</label>
        <select id="style">
          <option>Default</option>
          <option>Realistic</option>
          <option>Anime</option>
          <option>Cinematic</option>
        </select>

        <label for="theme">Theme</label>
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="purple">Purple</option>
          <option value="green">Green</option>
        </select>
      </section>

      <!-- Generate Button -->
      <button id="generateBtn">✨ Generate Image</button>

      <!-- Loading -->
      <div id="loading" class="hidden">⏳ AI is thinking...</div>

      <!-- Result Image -->
      <section id="imageContainer">
        <img id="resultImage" alt="Generated Image" />
        <a id="downloadBtn" class="hidden">Download</a>
      </section>

    </main>
  </div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
