<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIBGHAT AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
    overflow-x: hidden;
}

/* glow */
.background-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    background: #00e5ff;
    filter: blur(150px);
    top: -100px;
    left: -100px;
    opacity: 0.3;
}

/* container */
.container {
    text-align: center;
    padding: 50px 20px;
    position: relative;
}

/* logo */
.logo-img {
    width: 90px;
    border-radius: 12px;
    margin-bottom: 10px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* title */
h1 {
    font-size: 42px;
    margin: 10px 0;
}

h1 span {
    color: #00e5ff;
}

/* subtitle */
.subtitle {
    opacity: 0.7;
    margin-bottom: 20px;
}

/* inputs */
textarea, select {
    width: 80%;
    max-width: 500px;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* button */
button {
    background: linear-gradient(90deg, #00e5ff, #3b82f6);
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 15px;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #00e5ff;
}

/* loading */
#loading {
    display: none;
    margin-top: 15px;
    color: #00e5ff;
}

/* suggestions */
#suggestions {
    margin-top: 10px;
}

#suggestions button {
    margin: 5px;
    padding: 8px 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #00e5ff;
    color: black;
    font-weight: bold;
}

/* image */
#imageContainer {
    margin-top: 20px;
}

#resultImage {
    max-width: 80%;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0,229,255,0.3);
}

/* download */
#downloadBtn {
    display: none;
    margin-top: 15px;
    color: #00e5ff;
    text-decoration: none;
    font-weight: bold;
}

/* history */
#history {
    margin-top: 25px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
}

#history img {
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="container">

    <!-- LOGO -->
    <img src="logo.png" class="logo-img">

    <!-- TITLE -->
    <h1>SIBGHAT <span>AI</span></h1>

    <p class="subtitle">Turn your imagination into AI images</p>

    <!-- INPUT -->
    <textarea id="prompt" placeholder="Describe your image..."></textarea><br>

    <!-- SUGGESTIONS -->
    <div id="suggestions">
        <button onclick="setPrompt('A futuristic city at night')">City</button>
        <button onclick="setPrompt('A lion in jungle cinematic')">Lion</button>
        <button onclick="setPrompt('A cyberpunk robot warrior')">Robot</button>
    </div>

    <select id="style">
        <option>Default</option>
        <option>Realistic</option>
        <option>Anime</option>
        <option>Cinematic</option>
    </select><br>

    <select id="size">
        <option>Square</option>
        <option>Portrait</option>
        <option>Landscape</option>
    </select><br>

    <!-- BUTTON -->
    <button id="generateBtn" onclick="generateImage()">
        ✨ Generate Image
    </button>

    <!-- LOADING -->
    <div id="loading">Generating your image...</div>

    <!-- IMAGE OUTPUT -->
    <div id="imageContainer">
        <img id="resultImage">
    </div>

    <!-- DOWNLOAD -->
    <a id="downloadBtn">Download Image</a>

    <!-- HISTORY -->
    <div id="history"></div>

</div>

<script src="script.js"></script>

</body>
</html>
