<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIBGHAT AI - AI Image Generator</title>

<link rel="icon" type="image/png" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>


<div id="splash-screen">

<img src="logo.png" class="splash-logo">

<h1>SIBGHAT <span>AI</span></h1>

<p>Turning imagination into reality ✨</p>

</div>



<section id="login-section">

<h2>🔐 Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p>
Don't have account?
<a href="#" onclick="showSignup()">Signup</a>
</p>

</section>




<section id="signup-section" style="display:none;">

<h2>📝 Signup</h2>

<input id="newUsername" placeholder="Username">

<input id="newPassword" type="password" placeholder="Password">

<button onclick="signup()">Create Account</button>

<p>
Already have account?
<a href="#" onclick="showLogin()">Login</a>
</p>

</section>





<section id="owner-section">

<h2>👑 Owner Access</h2>

<input id="ownerCode" placeholder="Owner Code">

<button onclick="ownerAccess(document.getElementById('ownerCode').value)">
Access
</button>

</section>






<div id="app" style="display:none;">



<aside id="sidebar">


<h2>
⚡ History
</h2>


<button id="themeBtn">
🌙 Theme
</button>


<button id="clearHistoryBtn">
Clear
</button>


<h3>
🔥 Generated:
<span id="counter">
0
</span>
</h3>


<div id="history"></div>


<h2>
❤️ Favorites
</h2>

<div id="favorites"></div>


</aside>





<main class="container">


<header>

<img src="logo.png" class="logo-img">

<h1>
SIBGHAT <span>AI</span>
</h1>


<p>
Describe your imagination and AI will create it.
</p>


</header>





<textarea 
id="prompt"
placeholder="Describe your image..."
></textarea>





<div id="suggestions">


<button onclick="setPrompt('A futuristic city with neon lights')">
🏙️ City
</button>


<button onclick="setPrompt('A realistic lion in jungle cinematic style')">
🦁 Lion
</button>


<button onclick="setPrompt('A cyberpunk robot warrior')">
🤖 Robot
</button>


<button onclick="setPrompt('A realistic luxury car in cinematic style')">
🚗 Car
</button>


</div>







<div class="options">


<select id="style">

<option>Default</option>

<option>Realistic</option>

<option>Cinematic</option>

<option>Anime</option>

</select>




<select id="category">

<option value="">
Category
</option>

<option value="car">
Car
</option>

<option value="space">
Space
</option>

<option value="nature">
Nature
</option>

<option value="city">
City
</option>


</select>


</div>







<button id="generateBtn">

✨ Generate Image

</button>






<div id="loading" class="hidden">

<p id="loadingText">
⏳ AI is creating...
</p>

</div>






<div id="imageContainer">


<img id="resultImage">



<div id="imageActions">


<button id="favoriteBtn" class="hidden">
❤️ Favorite
</button>


<button id="shareBtn" class="hidden">
🔗 Share
</button>


</div>



<a id="downloadBtn" class="hidden">
Download Image
</a>



</div>




</main>


</div>




<script src="script.js"></script>

</body>

</html>
