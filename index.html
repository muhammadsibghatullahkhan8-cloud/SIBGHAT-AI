<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIBGHAT AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
    overflow-x: hidden;
}

/* splash */
#splash-screen{
    position:fixed;
    width:100%;
    height:100vh;
    background:#020617;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#splash-screen img{
    width:120px;
    border-radius:15px;
    box-shadow:0 0 30px #00e5ff;
}

#splash-screen h1{
    color:#00e5ff;
    margin-top:10px;
}

/* layout */
#app {
    display: flex;
}

/* sidebar */
#sidebar {
    width: 260px;
    background: #020617;
    height: 100vh;
    padding: 20px;
    border-right: 1px solid #1e293b;
    overflow-y: auto;
}

#sidebar h2 {
    color: #00e5ff;
}

#sidebar button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #00e5ff;
    cursor: pointer;
}

/* main */
.container {
    flex: 1;
    text-align: center;
    padding: 40px 20px;
}

/* logo */
.logo-img {
    width: 90px;
    border-radius: 12px;
    margin-bottom: 10px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* title */
h1 {
    font-size: 42px;
    margin: 10px 0;
}

h1 span {
    color: #00e5ff;
}

/* inputs */
textarea, select {
    width: 80%;
    max-width: 500px;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* button */
button {
    background: linear-gradient(90deg, #00e5ff, #3b82f6);
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #00e5ff;
}

/* history */
#history img {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash-screen">
    <img src="logo.png">
    <h1>SIBGHAT AI</h1>
</div>

<div id="app">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <h2>⚡ History</h2>
        <button onclick="clearHistory()">Clear History</button>
        <div id="history"></div>
    </div>

    <!-- MAIN -->
    <div class="container">

        <img src="logo.png" class="logo-img">

        <h1>SIBGHAT <span>AI</span></h1>

        <p class="subtitle">Turn imagination into AI images</p>

        <textarea id="prompt" placeholder="Describe your image..."></textarea>

        <div id="suggestions">
            <button onclick="setPrompt('A futuristic city at night')">City</button>
            <button onclick="setPrompt('A cinematic lion in jungle')">Lion</button>
            <button onclick="setPrompt('Cyberpunk robot warrior')">Robot</button>
        </div>

        <select id="style">
            <option>Default</option>
            <option>Realistic</option>
            <option>Anime</option>
            <option>Cinematic</option>
        </select>

        <button id="generateBtn">✨ Generate Image</button>

        <div id="loading">AI is thinking...</div>

        <div id="imageContainer">
            <img id="resultImage">
        </div>

        <a id="downloadBtn">Download</a>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
